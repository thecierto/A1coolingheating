<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>A1 Cooling &amp; Heating CRM</title>
<script>
// ── Cache buster: clear stale service workers and caches on every load ──
(function() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
  if ('caches' in window) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  }
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Literata:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2ee;
  --surface: #ffffff;
  --surface2: #ede9e3;
  --border: #d9d3ca;
  --text: #1a1714;
  --text-dim: #7a7369;
  --text-light: #b5aca0;
  --orange: #d4521a;
  --orange-light: #f5ddd0;
  --blue: #1a5fa8;
  --blue-light: #d0e3f5;
  --green: #1a7a3a;
  --green-light: #d0f0dc;
  --yellow: #b87c00;
  --yellow-light: #faf0d0;
  --purple: #6b3fa0;
  --purple-light: #ead0f5;
  --teal: #1a7a6e;
  --teal-light: #d0f0ec;
  --red: #b83030;
  --red-light: #f5d0d0;
  --radius: 14px;
  --shadow: 0 2px 16px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.14);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

/* ── DESKTOP SHELL ── */
body {
  font-family: 'Literata', Georgia, serif;
  background: #e8e3dc;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Centre the phone-width app on desktop */
.app-shell {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  box-shadow: 0 0 60px rgba(0,0,0,0.18);
  position: relative;
  overflow-x: hidden;
}

@media (min-width: 700px) {
  body { display: flex; align-items: flex-start; justify-content: center; padding: 0; }
  .app-shell { min-height: 100vh; }
}

/* ── HEADER ── */
.header {
  background: var(--text);
  padding: 18px 20px 14px;
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: 'Syne', sans-serif; font-weight: 800;
  font-size: 20px; color: #fff; letter-spacing: -0.3px;
}
.logo em { color: var(--orange); font-style: normal; }
.logo .sub { font-size: 10px; color: rgba(255,255,255,0.45); font-family:'Literata',serif; font-weight:300; display:block; margin-top:-2px; letter-spacing:1.5px; text-transform:uppercase; }
.header-right { display:flex; gap:8px; align-items:center; }
.hbtn {
  background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
  border-radius:8px; padding:7px 12px; color:#fff; font-family:'Syne',sans-serif;
  font-size:12px; font-weight:600; cursor:pointer; transition:background 0.15s;
  white-space:nowrap;
}
.hbtn:active { background:rgba(255,255,255,0.2); }
.hbtn.primary { background:var(--orange); border-color:var(--orange); }

/* ── NAV TABS ── */
.nav-tabs {
  background: var(--text); border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; padding: 0 16px 14px; gap: 6px;
}
.tab {
  padding: 7px 14px; border-radius: 30px; font-family:'Syne',sans-serif;
  font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s;
  color: rgba(255,255,255,0.45); white-space:nowrap;
}
.tab.active { background:var(--orange); color:#fff; }
.tab .tab-count {
  background: rgba(255,255,255,0.2); border-radius:10px;
  padding:1px 6px; font-size:10px; margin-left:4px;
}
.tab.active .tab-count { background:rgba(255,255,255,0.3); }

/* ── PAGES ── */
.page { display:none; padding:20px; padding-bottom:30px; }
.page.active { display:block; animation: rise 0.22s ease; }
@keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

/* ── PIPELINE VIEW ── */
.pipeline-header {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
}
.stage-title { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; }
.stage-meta { font-size:12px; color:var(--text-dim); }

.stage-block { margin-bottom:20px; }
.stage-bar {
  height: 4px; border-radius: 2px; margin-bottom:12px; width:100%;
}

.lead-card {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 10px;
  overflow: hidden; cursor:pointer;
  transition: transform 0.12s, box-shadow 0.12s;
  border: 1.5px solid transparent;
}
.lead-card:active { transform:scale(0.985); box-shadow: var(--shadow-lg); }
.lead-card.selected { border-color: var(--orange); }
.lead-card-inner { padding: 14px 16px; }
.lead-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
.lead-name { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; }
.lead-age { font-size:10px; color:var(--text-light); font-style:italic; }
.lead-service { font-size:13px; color:var(--text-dim); margin-bottom:6px; }
.lead-footer { display:flex; justify-content:space-between; align-items:center; }
.lead-contact { font-size:11px; color:var(--text-dim); }
.lead-value { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; }
.stage-pip {
  height: 3px; width:100%;
}
.lead-source {
  display:inline-block; font-size:9px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.8px; padding:2px 7px; border-radius:20px; margin-bottom:6px;
}
.lead-notes-preview { font-size:11px; color:var(--text-dim); font-style:italic; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ── STAGE COLORS ── */
.s-warm   { --sc:#b87c00; --sl:var(--yellow-light); --sb:#faf0d0; }
.s-contact{ --sc:#1a5fa8; --sl:var(--blue-light);   --sb:#d0e3f5; }
.s-estimate{ --sc:#6b3fa0; --sl:var(--purple-light); --sb:#ead0f5; }
.s-scheduled{ --sc:#d4521a; --sl:var(--orange-light); --sb:#f5ddd0; }
.s-completed{ --sc:#1a7a3a; --sl:var(--green-light);  --sb:#d0f0dc; }

.stage-label {
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 10px; border-radius:20px; font-size:10px;
  font-family:'Syne',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;
}

/* ── STATS ROW ── */
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
.stat-box {
  background:var(--surface); border-radius:12px; padding:14px 12px;
  box-shadow:var(--shadow); text-align:center;
}
.stat-box .sv { font-family:'Syne',sans-serif; font-weight:800; font-size:26px; line-height:1; }
.stat-box .sl { font-size:10px; color:var(--text-dim); margin-top:3px; text-transform:uppercase; letter-spacing:0.5px; }

/* ── CLIENT LIST ── */
.client-card {
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  margin-bottom:10px; padding:16px; display:flex; gap:14px; align-items:flex-start;
  cursor:pointer; transition:transform 0.12s;
}
.client-card:active { transform:scale(0.985); }
.client-avatar {
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Syne',sans-serif; font-weight:800; font-size:17px;
}
.client-info { flex:1; min-width:0; }
.client-name { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; }
.client-detail { font-size:12px; color:var(--text-dim); margin-top:2px; }
.client-service { font-size:11px; margin-top:4px; font-style:italic; color:var(--text-dim); }
.client-right { text-align:right; flex-shrink:0; }
.client-value { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; color:var(--green); }
.client-date { font-size:10px; color:var(--text-light); margin-top:2px; }

/* ── SEARCH ── */
.search-row { display:flex; gap:10px; margin-bottom:16px; }
.search-wrap {
  flex:1; background:var(--surface); border:1.5px solid var(--border);
  border-radius:10px; padding:10px 14px; display:flex; gap:8px; align-items:center;
}
.search-wrap input {
  background:none; border:none; outline:none; font-family:'Literata',serif;
  font-size:14px; color:var(--text); width:100%;
}
.search-wrap input::placeholder { color:var(--text-light); }

/* ── FAB ── */
.fab {
  position:fixed; bottom:28px; right:calc(50% - 430px/2 + 20px);
  width:56px; height:56px; border-radius:50%;
  background:var(--orange); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:28px; font-weight:300; cursor:pointer; z-index:90;
  box-shadow:0 4px 24px rgba(212,82,26,0.45);
  transition:transform 0.15s, box-shadow 0.12s;
  line-height:1;
}
.fab:active { transform:scale(0.91); }
/* On small screens fall back to simple right:20px */
@media (max-width: 699px) {
  .fab { right: 20px; }
}

/* ── MODAL ── */
.overlay {
  position:fixed; inset:0; background:rgba(26,23,20,0.6); z-index:200;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.22s;
  backdrop-filter:blur(2px);
}
.overlay.open { opacity:1; pointer-events:all; }
.sheet {
  background:var(--surface); border-radius:22px 22px 0 0;
  padding:24px 22px 44px; width:100%; max-width:430px;
  transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.32,1,0.52,1);
  max-height:92vh; overflow-y:auto;
}
.overlay.open .sheet { transform:translateY(0); }
.sheet-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 22px; }
.sheet-title { font-family:'Syne',sans-serif; font-weight:800; font-size:20px; margin-bottom:22px; }

/* ── FORM ── */
.fg { margin-bottom:15px; }
.fl { font-family:'Syne',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dim); display:block; margin-bottom:6px; }
.fi {
  width:100%; background:var(--bg); border:1.5px solid var(--border);
  border-radius:10px; padding:12px 14px; font-family:'Literata',serif; font-size:15px;
  color:var(--text); outline:none; transition:border-color 0.15s;
}
.fi:focus { border-color:var(--orange); }
.fr { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.btn { width:100%; padding:14px; border-radius:var(--radius); font-family:'Syne',sans-serif; font-weight:700; font-size:14px; cursor:pointer; border:none; transition:opacity 0.15s, transform 0.1s; margin-top:8px; }
.btn:active { opacity:0.85; transform:scale(0.98); }
.btn-orange { background:var(--orange); color:#fff; }
.btn-ghost { background:transparent; color:var(--text-dim); border:1.5px solid var(--border); }

/* ── DETAIL SHEET ── */
.detail-section { margin-bottom:20px; }
.detail-label { font-family:'Syne',sans-serif; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-dim); margin-bottom:6px; }
.detail-value { font-size:15px; }
.detail-row { display:flex; gap:16px; }
.detail-col { flex:1; }
.stage-steps { display:flex; gap:0; margin:16px 0; }
.stage-step {
  flex:1; text-align:center; position:relative;
}
.stage-step::after {
  content:''; position:absolute; top:14px; left:50%; width:100%; height:2px;
  background:var(--border); z-index:0;
}
.stage-step:last-child::after { display:none; }
.step-dot {
  width:28px; height:28px; border-radius:50%; border:2px solid var(--border);
  background:var(--surface); margin:0 auto 6px; z-index:1; position:relative;
  display:flex; align-items:center; justify-content:center; font-size:12px;
  transition:all 0.2s;
}
.step-dot.done { background:var(--green); border-color:var(--green); }
.step-dot.current { background:var(--orange); border-color:var(--orange); animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(212,82,26,0.4)} 50%{box-shadow:0 0 0 6px rgba(212,82,26,0)} }
.step-label { font-size:9px; color:var(--text-dim); font-family:'Syne',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.3px; }
.notes-area { width:100%; min-height:80px; resize:none; }

/* ── STAGE DROPDOWN ── */
.stage-select-wrap {
  position: relative; display: inline-flex; align-items: center;
}
.stage-select {
  appearance: none; -webkit-appearance: none;
  border: none; outline: none; cursor: pointer;
  font-family: 'Syne', sans-serif; font-weight: 600;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 4px 22px 4px 10px; border-radius: 20px;
  background-color: transparent;
  transition: opacity 0.15s;
}
.stage-select:active { opacity: 0.75; }
.stage-select-arrow {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  font-size: 8px; pointer-events: none; opacity: 0.7;
}
/* Full-width stage select in detail sheet */
.stage-select-full {
  appearance: none; -webkit-appearance: none;
  width: 100%; border: 1.5px solid var(--border); outline: none; cursor: pointer;
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px;
  padding: 13px 44px 13px 16px; border-radius: 12px;
  background: var(--bg); color: var(--text);
  transition: border-color 0.15s;
}
.stage-select-full:focus { border-color: var(--orange); }
.stage-select-full-wrap { position: relative; }
.stage-select-full-wrap::after {
  content: '▾'; position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%); font-size: 16px;
  color: var(--text-dim); pointer-events: none;
}

/* ── ACTIVITY LOG ── */
.activity-log { margin-top: 4px; }
.activity-entry {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.activity-entry:last-child { border-bottom: none; }
.activity-icon {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0; margin-top: 1px;
}
.activity-body { flex: 1; min-width: 0; }
.activity-text { font-size: 13px; line-height: 1.4; }
.activity-time { font-size: 10px; color: var(--text-light); margin-top: 2px; font-style: italic; }
.log-input-row {
  display: flex; gap: 8px; margin-top: 12px; align-items: flex-start;
}
.log-input {
  flex: 1; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 10px 12px; font-family: 'Literata', serif;
  font-size: 14px; color: var(--text); outline: none;
  transition: border-color 0.15s; resize: none; min-height: 42px;
}
.log-input:focus { border-color: var(--orange); }
.log-add-btn {
  background: var(--orange); color: #fff; border: none;
  border-radius: 10px; padding: 10px 14px; font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap;
  transition: opacity 0.15s; flex-shrink: 0;
}
.log-add-btn:active { opacity: 0.8; }
.empty { text-align:center; padding:48px 20px; color:var(--text-dim); }
.empty .e-icon { font-size:40px; margin-bottom:12px; }
.empty .e-title { font-family:'Syne',sans-serif; font-weight:700; font-size:16px; color:var(--text); margin-bottom:6px; }
.empty .e-sub { font-size:13px; font-style:italic; }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--text); color:#fff; padding:10px 22px; border-radius:30px;
  font-family:'Syne',sans-serif; font-size:13px; font-weight:600;
  z-index:500; opacity:0; transition:all 0.25s; pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

::-webkit-scrollbar { display:none; }

/* ── SECTION DIVIDER ── */
.sdiv { font-family:'Syne',sans-serif; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-dim); margin:20px 0 10px; display:flex; align-items:center; gap:10px; }
.sdiv::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── SMS ── */
.sms-btn {
  display:inline-flex; align-items:center; gap:6px;
  background:#1a7a3a; color:#fff; border:none; border-radius:10px;
  padding:11px 16px; font-family:'Syne',sans-serif; font-weight:700;
  font-size:13px; cursor:pointer; transition:opacity 0.15s; width:100%;
  justify-content:center; margin-bottom:8px;
}
.sms-btn:active { opacity:0.85; }
.sms-template-card {
  background:var(--surface2); border:1.5px solid var(--border);
  border-radius:12px; padding:14px 16px; margin-bottom:10px;
  cursor:pointer; transition:border-color 0.15s, transform 0.1s;
}
.sms-template-card:active { border-color:var(--orange); transform:scale(0.985); }
.sms-template-label { font-family:'Syne',sans-serif; font-weight:700; font-size:13px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.sms-template-preview { font-size:12px; color:var(--text-dim); font-style:italic; line-height:1.5; }
.sms-template-tag { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; padding:2px 7px; border-radius:20px; background:rgba(212,82,26,0.12); color:var(--orange); }
.sms-edit-area { width:100%; min-height:100px; resize:vertical; }
.sms-send-btn {
  background:var(--orange); color:#fff; border:none; border-radius:10px;
  padding:13px 20px; font-family:'Syne',sans-serif; font-weight:700;
  font-size:14px; cursor:pointer; width:100%; margin-top:8px; transition:opacity 0.15s;
}
.sms-send-btn:active { opacity:0.85; }

/* ── TEMPLATES EDITOR ── */
.stage-group { margin-bottom:28px; }
.stage-group-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px; padding-bottom:10px; border-bottom:2px solid var(--border);
}
.stage-group-title {
  font-family:'Syne',sans-serif; font-weight:800; font-size:15px;
  display:flex; align-items:center; gap:8px;
}
.add-template-btn {
  background:var(--orange); color:#fff; border:none; border-radius:8px;
  padding:6px 12px; font-family:'Syne',sans-serif; font-weight:700;
  font-size:11px; cursor:pointer; transition:opacity 0.15s; white-space:nowrap;
}
.add-template-btn:active { opacity:0.8; }
.template-edit-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:12px; margin-bottom:10px; overflow:hidden;
  box-shadow: var(--shadow);
}
.template-edit-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; background:var(--surface2); cursor:pointer;
  gap:10px;
}
.template-edit-name-input {
  background:none; border:none; outline:none;
  font-family:'Syne',sans-serif; font-weight:700; font-size:13px;
  color:var(--text); flex:1; min-width:0;
}
.template-edit-name-input::placeholder { color:var(--text-dim); }
.template-delete-btn {
  background:none; border:none; color:var(--red); font-size:18px;
  cursor:pointer; padding:0 2px; flex-shrink:0; line-height:1;
}
.template-edit-body { padding:12px 14px; }
.template-body-input {
  width:100%; background:var(--bg); border:1.5px solid var(--border);
  border-radius:10px; padding:12px 14px; font-family:'Literata',serif;
  font-size:14px; color:var(--text); outline:none; resize:vertical;
  min-height:90px; transition:border-color 0.15s; line-height:1.5;
}
.template-body-input:focus { border-color:var(--orange); }
.template-hint {
  font-size:10px; color:var(--text-light); font-style:italic;
  margin-top:6px; line-height:1.4;
}
.save-templates-bar {
  position:sticky; bottom:0; background:var(--bg);
  padding:14px 20px 28px; border-top:1px solid var(--border);
  margin: 0 -20px -30px;
}
.save-templates-btn {
  width:100%; background:var(--orange); color:#fff; border:none;
  border-radius:var(--radius); padding:15px; font-family:'Syne',sans-serif;
  font-weight:700; font-size:15px; cursor:pointer; transition:opacity 0.15s;
}
.save-templates-btn:active { opacity:0.85; }

/* ── WIDGET PAGE ── */
.widget-section { margin-bottom:28px; }
.widget-section-title {
  font-family:'Syne',sans-serif; font-weight:800; font-size:16px;
  margin-bottom:4px;
}
.widget-section-sub {
  font-size:13px; color:var(--text-dim); font-style:italic;
  line-height:1.5; margin-bottom:16px;
}
.code-block {
  background:var(--text); color:#a8d8a8; border-radius:12px;
  padding:16px; font-family:monospace; font-size:11px;
  line-height:1.6; white-space:pre-wrap; word-break:break-all;
  position:relative; margin-bottom:10px;
}
.copy-btn {
  position:absolute; top:10px; right:10px;
  background:var(--orange); color:#fff; border:none; border-radius:7px;
  padding:5px 12px; font-family:'Syne',sans-serif; font-weight:700;
  font-size:11px; cursor:pointer; transition:opacity 0.15s;
}
.copy-btn:active { opacity:0.8; }
.copy-btn.copied { background:var(--green); }
.instruction-step {
  display:flex; gap:12px; align-items:flex-start;
  background:var(--surface); border-radius:12px; padding:14px;
  margin-bottom:10px; box-shadow:var(--shadow);
}
.step-num {
  width:28px; height:28px; border-radius:50%; background:var(--orange);
  color:#fff; font-family:'Syne',sans-serif; font-weight:800; font-size:13px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.step-text { font-size:13px; line-height:1.5; padding-top:3px; }
.step-text strong { font-family:'Syne',sans-serif; display:block; margin-bottom:2px; }
.inbound-badge {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(26,122,58,0.12); color:var(--green);
  border-radius:20px; padding:4px 12px;
  font-family:'Syne',sans-serif; font-weight:700; font-size:11px;
}
.pulse-dot {
  width:7px; height:7px; border-radius:50%; background:var(--green);
  animation:pulse-green 1.5s infinite;
}
@keyframes pulse-green {
  0%,100%{box-shadow:0 0 0 0 rgba(26,122,58,0.5)}
  50%{box-shadow:0 0 0 5px rgba(26,122,58,0)}
}
</style>
</head>
<body>

<div class="app-shell">

<div class="header">
  <div class="logo">Air<em>Pro</em><span class="sub">Lead Pipeline</span></div>
  <div class="header-right">
    <div class="hbtn" onclick="exportData()">⬇ Export</div>
    <div class="hbtn primary" onclick="openAdd()">+ Lead</div>
  </div>
</div>

<div class="nav-tabs" id="navTabs">
  <div class="tab active" onclick="switchTab('pipeline',this)">Pipeline <span class="tab-count" id="tc-pipeline">0</span></div>
  <div class="tab" onclick="switchTab('clients',this)">Clients <span class="tab-count" id="tc-clients">0</span></div>
  <div class="tab" onclick="switchTab('templates',this)">💬 Templates</div>
  <div class="tab" onclick="switchTab('widget',this)">🌐 Widget</div>
</div>

<!-- PIPELINE PAGE -->
<div class="page active" id="page-pipeline">
  <div class="stats-row" id="statsRow"></div>
  <div id="pipelineContent"></div>
</div>

<!-- CLIENTS PAGE -->
<div class="page" id="page-clients">
  <div class="search-row">
    <div class="search-wrap"><span style="color:var(--text-light)">🔍</span><input type="text" placeholder="Search clients…" id="clientSearch" oninput="renderClients()"></div>
  </div>
  <div id="clientsContent"></div>
</div>

<!-- TEMPLATES PAGE -->
<div class="page" id="page-templates">
  <div id="templatesContent"></div>
</div>

<!-- WIDGET PAGE -->
<div class="page" id="page-widget">
  <div id="widgetContent"></div>
</div>

<div class="fab" id="fabBtn" onclick="openAdd()">+</div>

<!-- ADD LEAD SHEET -->
<div class="overlay" id="addOverlay" onclick="handleOvClick(event,'addOverlay')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">New Lead</div>
    <div class="fr">
      <div class="fg"><label class="fl">First Name</label><input class="fi" id="f-first" placeholder="Jane"></div>
      <div class="fg"><label class="fl">Last Name</label><input class="fi" id="f-last" placeholder="Doe"></div>
    </div>
    <div class="fg"><label class="fl">Phone</label><input class="fi" id="f-phone" type="tel" placeholder="(555) 000-0000"></div>
    <div class="fg"><label class="fl">Email</label><input class="fi" id="f-email" type="email" placeholder="jane@email.com"></div>
    <div class="fg"><label class="fl">Service Address</label><input class="fi" id="f-address" placeholder="123 Main St, City, ST"></div>
    <div class="fg"><label class="fl">Service Needed</label>
      <select class="fi" id="f-service">
        <option value="">Select…</option>
        <option>AC Installation</option>
        <option>AC Repair</option>
        <option>Heating Repair</option>
        <option>Heating Installation</option>
        <option>Preventive Maintenance</option>
        <option>Duct Cleaning</option>
        <option>System Inspection</option>
        <option>Emergency Service</option>
        <option>Other</option>
      </select>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Est. Value ($)</label><input class="fi" id="f-value" type="number" placeholder="0"></div>
      <div class="fg"><label class="fl">Lead Source</label>
        <select class="fi" id="f-source">
          <option>Website</option>
          <option>Google</option>
          <option>Referral</option>
          <option>Facebook</option>
          <option>Yelp</option>
          <option>Walk-in</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="fg"><label class="fl">Notes</label><textarea class="fi notes-area" id="f-notes" placeholder="Any details about the job or customer…"></textarea></div>
    <button class="btn btn-orange" onclick="saveLead()">Save Lead</button>
    <button class="btn btn-ghost" onclick="closeOverlay('addOverlay')">Cancel</button>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="overlay" id="detailOverlay" onclick="handleOvClick(event,'detailOverlay')">
  <div class="sheet" id="detailSheet"></div>
</div>

<!-- CLIENT DETAIL SHEET -->
<div class="overlay" id="clientOverlay" onclick="handleOvClick(event,'clientOverlay')">
  <div class="sheet" id="clientSheet"></div>
</div>

<!-- SMS SHEET -->
<div class="overlay" id="smsOverlay" onclick="handleOvClick(event,'smsOverlay')">
  <div class="sheet" id="smsSheet"></div>
</div>

<!-- EMAIL SHEET -->
<div class="overlay" id="emailOverlay" onclick="handleOvClick(event,'emailOverlay')">
  <div class="sheet" id="emailSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════
//  STAGES CONFIG
// ══════════════════════════════
const STAGES = [
  { id:'warm',      label:'Warm Lead',          icon:'🌡️',  cls:'s-warm',      color:'#b87c00' },
  { id:'contact',   label:'Initial Contact',    icon:'📞',  cls:'s-contact',   color:'#1a5fa8' },
  { id:'estimate',  label:'Estimate Completed', icon:'📋',  cls:'s-estimate',  color:'#6b3fa0' },
  { id:'scheduled', label:'Scheduled',          icon:'📅',  cls:'s-scheduled', color:'#d4521a' },
  { id:'completed', label:'Completed',          icon:'✅',  cls:'s-completed', color:'#1a7a3a' },
];
const STAGE_IDS = STAGES.map(s=>s.id);

// ══════════════════════════════
//  STORAGE  (localStorage)
// ══════════════════════════════
function loadData() {
  try {
    const raw = localStorage.getItem('airpro_leads');
    return raw ? JSON.parse(raw) : { leads:[], clients:[], nextId:1 };
  } catch(e) { return { leads:[], clients:[], nextId:1 }; }
}
function saveData(db) {
  try { localStorage.setItem('airpro_leads', JSON.stringify(db)); } catch(e){}
}
let DB = loadData();

// ══════════════════════════════
//  HELPERS
// ══════════════════════════════
function stageInfo(id) { return STAGES.find(s=>s.id===id) || STAGES[0]; }
function daysAgo(ts) {
  const d = Math.floor((Date.now()-ts)/86400000);
  return d===0?'Today':d===1?'Yesterday':`${d}d ago`;
}
function fmt$(n) { return '$'+(Number(n)||0).toLocaleString(); }
function initials(first,last) { return ((first[0]||'')+(last[0]||'')).toUpperCase(); }
function avatarColor(str) {
  const colors = ['#d4521a','#1a5fa8','#6b3fa0','#1a7a3a','#b87c00','#1a7a6e','#b83030'];
  let h=0; for(let c of str) h=(h*31+c.charCodeAt(0))%colors.length;
  return colors[Math.abs(h)];
}
function fmtDate(ts) { return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

// ══════════════════════════════
//  TABS
// ══════════════════════════════
let currentTab = 'pipeline';
function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('fabBtn').style.display = tab==='pipeline' ? 'flex' : 'none';
  if (tab === 'templates') renderTemplatesPage();
  else if (tab === 'widget') renderWidgetPage();
  else render();
}

// ══════════════════════════════
//  RENDER
// ══════════════════════════════
function render() {
  updateCounts();
  renderStats();
  renderPipeline();
  renderClients();
}

function updateCounts() {
  document.getElementById('tc-pipeline').textContent = DB.leads.length;
  document.getElementById('tc-clients').textContent = DB.clients.length;
}

function renderStats() {
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const leadsThisMonth = DB.leads.filter(l => l.created >= startOfMonth).length;
  const scheduledThisMonth = DB.leads.filter(l => l.stage === 'scheduled' && l.updated >= startOfMonth).length;
  const totalVal = DB.leads.reduce((s,l)=>s+(Number(l.value)||0),0);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="sv" style="color:var(--orange)">${leadsThisMonth}</div><div class="sl">Leads This Month</div></div>
    <div class="stat-box"><div class="sv" style="color:var(--blue)">${scheduledThisMonth}</div><div class="sl">Scheduled This Month</div></div>
    <div class="stat-box"><div class="sv" style="color:var(--green)">${fmt$(totalVal)}</div><div class="sl">Pipeline $</div></div>
  `;
}

function renderPipeline() {
  const cont = document.getElementById('pipelineContent');
  let html = '';
  STAGES.forEach(stage => {
    const stageLeads = DB.leads.filter(l=>l.stage===stage.id);
    const stageVal = stageLeads.reduce((s,l)=>s+(Number(l.value)||0),0);
    html += `
      <div class="stage-block">
        <div class="pipeline-header">
          <div class="stage-title">${stage.icon} ${stage.label}</div>
          <div class="stage-meta">${stageLeads.length} lead${stageLeads.length!==1?'s':''} · ${fmt$(stageVal)}</div>
        </div>
        <div class="stage-bar" style="background:${stage.color}22">
          <div style="height:100%;width:${stageLeads.length?100:0}%;background:${stage.color};border-radius:2px;transition:width 0.5s"></div>
        </div>
    `;
    if (!stageLeads.length) {
      html += `<div style="padding:14px 0;text-align:center;color:var(--text-light);font-size:13px;font-style:italic">No leads at this stage</div>`;
    } else {
      stageLeads.forEach(lead => {
        const stageOptions = STAGES.map(s =>
          `<option value="${s.id}" ${s.id===lead.stage?'selected':''}>${s.icon} ${s.label}</option>`
        ).join('');
        html += `
          <div class="lead-card" onclick="openDetail(${lead.id})">
            <div class="stage-pip" style="background:${stage.color}"></div>
            <div class="lead-card-inner">
              <div class="lead-top">
                <div class="lead-name">${lead.first} ${lead.last}</div>
                <div class="lead-age">${daysAgo(lead.created)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span class="lead-source" style="background:${stage.color}18;color:${stage.color};margin-bottom:0">${lead.source}</span>
                <div class="stage-select-wrap" onclick="event.stopPropagation()">
                  <select class="stage-select" style="background:${stage.color}18;color:${stage.color}"
                    onchange="changeStage(${lead.id}, this.value)">
                    ${stageOptions}
                  </select>
                  <span class="stage-select-arrow" style="color:${stage.color}">▾</span>
                </div>
              </div>
              <div class="lead-service">${lead.service}</div>
              ${lead.notes ? `<div class="lead-notes-preview">💬 ${lead.notes}</div>` : ''}
              <div class="lead-footer" style="margin-top:8px">
                <div class="lead-contact">📞 ${lead.phone}</div>
                <div class="lead-value" style="color:${stage.color}">${fmt$(lead.value)}</div>
              </div>
            </div>
          </div>
        `;
      });
    }
    html += `</div>`;
  });
  cont.innerHTML = html;
}

function renderClients() {
  const q = (document.getElementById('clientSearch')?.value||'').toLowerCase();
  let clients = DB.clients;
  if (q) clients = clients.filter(c=>(c.first+' '+c.last+c.service+c.address).toLowerCase().includes(q));
  const cont = document.getElementById('clientsContent');
  if (!clients.length) {
    cont.innerHTML = `<div class="empty"><div class="e-icon">🏠</div><div class="e-title">${q?'No results':'No clients yet'}</div><div class="e-sub">${q?'Try a different search':'Completed leads will appear here'}</div></div>`;
    return;
  }
  const totalRev = DB.clients.reduce((s,c)=>s+(Number(c.value)||0),0);
  cont.innerHTML = `
    <div style="background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--green)">${fmt$(totalRev)}</div><div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px">Total Client Revenue</div></div>
      <div style="text-align:right"><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:22px">${DB.clients.length}</div><div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px">Total Clients</div></div>
    </div>
  ` + clients.map(c => {
    const col = avatarColor(c.first+c.last);
    return `
      <div class="client-card" onclick="openClientDetail(${c.id})">
        <div class="client-avatar" style="background:${col}18;color:${col}">${initials(c.first,c.last)}</div>
        <div class="client-info">
          <div class="client-name">${c.first} ${c.last}</div>
          <div class="client-detail">📞 ${c.phone}</div>
          <div class="client-detail">📍 ${c.address}</div>
          <div class="client-service">${c.service}</div>
        </div>
        <div class="client-right">
          <div class="client-value">${fmt$(c.value)}</div>
          <div class="client-date">Completed<br>${fmtDate(c.completedDate)}</div>
        </div>
      </div>
    `;
  }).join('');
}

// ══════════════════════════════
//  ACTIVITY LOG
// ══════════════════════════════
const LOG_ICONS = {
  stage:   { bg:'rgba(212,82,26,0.12)', color:'var(--orange)', icon:'🔄' },
  sms:     { bg:'rgba(26,122,58,0.12)',  color:'var(--green)',  icon:'💬' },
  call:    { bg:'rgba(26,95,168,0.12)',  color:'var(--blue)',   icon:'📞' },
  email:   { bg:'rgba(107,63,160,0.12)', color:'var(--purple)', icon:'📧' },
  note:    { bg:'rgba(184,124,0,0.12)',  color:'var(--yellow)', icon:'📝' },
  created: { bg:'rgba(184,124,0,0.12)',  color:'var(--yellow)', icon:'🌡️' },
  value:   { bg:'rgba(26,122,58,0.12)',  color:'var(--green)',  icon:'💰' },
};

function addLog(leadId, type, text) {
  const lead = DB.leads.find(l => l.id === leadId);
  if (!lead) return;
  if (!lead.log) lead.log = [];
  lead.log.push({ type, text, ts: Date.now() });
  saveData(DB);
}

function renderLog(lead) {
  if (!lead.log || !lead.log.length) {
    return `<div style="font-size:13px;color:var(--text-light);font-style:italic;padding:8px 0">No activity yet — actions will appear here.</div>`;
  }
  return [...lead.log].reverse().map(entry => {
    const meta = LOG_ICONS[entry.type] || LOG_ICONS.note;
    return `
      <div class="activity-entry">
        <div class="activity-icon" style="background:${meta.bg}">${meta.icon}</div>
        <div class="activity-body">
          <div class="activity-text">${escHtml(entry.text)}</div>
          <div class="activity-time">${fmtDateTime(entry.ts)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function fmtDateTime(ts) {
  return new Date(ts).toLocaleString('en-US', {
    month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true
  });
}

function addManualLog(id) {
  const input = document.getElementById('log-manual-input');
  const text = input?.value?.trim();
  if (!text) return;
  addLog(id, 'note', text);
  input.value = '';
  // Re-render just the log section
  const logWrap = document.getElementById('log-entries-'+id);
  if (logWrap) {
    const lead = DB.leads.find(l=>l.id===id);
    logWrap.innerHTML = lead ? renderLog(lead) : '';
  }
  toast('📝 Note logged');
}
function openDetail(id) {
  const lead = DB.leads.find(l=>l.id===id);
  if (!lead) return;
  const si = stageInfo(lead.stage);
  const stageIdx = STAGE_IDS.indexOf(lead.stage);

  // stage steps
  const steps = STAGES.map((s,i) => {
    const done = i < stageIdx;
    const curr = i === stageIdx;
    return `<div class="stage-step">
      <div class="step-dot ${done?'done':curr?'current':''}">${done?'✓':s.icon}</div>
      <div class="step-label">${s.label.split(' ')[0]}</div>
    </div>`;
  }).join('');

  const stageOptions = STAGES.map(s =>
    `<option value="${s.id}" ${s.id===lead.stage?'selected':''}>${s.icon} ${s.label}</option>`
  ).join('');

  document.getElementById('detailSheet').innerHTML = `
    <div class="sheet-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
      <div class="sheet-title" style="margin-bottom:0">${lead.first} ${lead.last}</div>
      <button onclick="deleteLead(${id})" style="background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:4px">🗑</button>
    </div>
    <div style="margin-bottom:18px">
      <span style="font-size:11px;color:var(--text-light)">Added ${daysAgo(lead.created)}</span>
    </div>

    <div class="stage-steps">${steps}</div>

    <div class="detail-section" style="margin-top:4px">
      <div class="detail-label">Move to Stage</div>
      <div class="stage-select-full-wrap">
        <select class="stage-select-full" onchange="changeStageFromDetail(${id}, this.value)">
          ${stageOptions}
        </select>
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:6px;font-style:italic">Select any stage to move this lead instantly</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Contact</div>
      <div class="detail-row">
        <div class="detail-col"><div style="font-size:12px;color:var(--text-dim)">Phone</div><div class="detail-value"><a href="tel:${lead.phone}" style="color:var(--blue);text-decoration:none">${lead.phone}</a></div></div>
        <div class="detail-col"><div style="font-size:12px;color:var(--text-dim)">Email</div><div class="detail-value" style="font-size:13px;word-break:break-all"><a href="mailto:${lead.email}" style="color:var(--blue);text-decoration:none">${lead.email||'—'}</a></div></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="tel:${lead.phone}" onclick="logCall(${id})" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--blue);color:#fff;border-radius:10px;padding:11px 6px;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;text-decoration:none">📞 Call</a>
        <button onclick="openSMS('${lead.phone}','${lead.first}','${lead.service}','${lead.stage}','lead',${id})" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#1a7a3a;color:#fff;border:none;border-radius:10px;padding:11px 6px;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer">💬 SMS</button>
        <button onclick="openEmail('${lead.email}','${lead.first}','${lead.service}','${lead.stage}',${id})" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#6b3fa0;color:#fff;border:none;border-radius:10px;padding:11px 6px;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer${!lead.email?' opacity:0.45;':''}">📧 Email</button>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Job Details</div>
      <div class="detail-row" style="margin-bottom:8px">
        <div class="detail-col"><div style="font-size:12px;color:var(--text-dim)">Service</div><div class="detail-value">${lead.service}</div></div>
        <div class="detail-col">
          <div style="font-size:12px;color:var(--text-dim)">Est. Value</div>
          ${lead.stage === 'estimate' ? `
            <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
              <span style="font-size:15px;font-weight:700;color:${si.color}">$</span>
              <input type="number" id="detail-value-${id}" value="${lead.value||0}"
                style="flex:1;background:var(--bg);border:1.5px solid ${si.color};border-radius:8px;padding:6px 10px;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;color:${si.color};outline:none;width:100%">
              <button onclick="saveValue(${id})" style="background:${si.color};color:#fff;border:none;border-radius:8px;padding:7px 12px;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">Save</button>
            </div>
          ` : `
            <div class="detail-value" style="color:${si.color};font-family:'Syne',sans-serif;font-weight:700">${fmt$(lead.value)}</div>
          `}
        </div>
      </div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:2px">Address</div>
      <div class="detail-value" style="font-size:14px">${lead.address||'—'}</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Source</div>
      <div class="detail-value">${lead.source}</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Notes</div>
      <textarea class="fi notes-area" id="detail-notes-${id}" style="margin-top:4px">${lead.notes||''}</textarea>

function changeStage(id, newStageId) {
  const lead = DB.leads.find(l=>l.id===id);
  if (!lead || lead.stage === newStageId) return;
  const si = stageInfo(newStageId);
  const oldSi = stageInfo(lead.stage);

  if (newStageId === 'completed') {
    if (!confirm(`Move ${lead.first} ${lead.last} to Completed? They'll be saved to your Clients database.`)) {
      render(); return;
    }
    addLog(id, 'stage', `Stage changed: ${oldSi.label} → ${si.label}`);
    DB.clients.push({
      id: lead.id, first: lead.first, last: lead.last,
      phone: lead.phone, email: lead.email,
      address: lead.address, service: lead.service,
      value: lead.value, source: lead.source,
      notes: lead.notes, completedDate: Date.now(),
      log: lead.log || []
    });
    DB.leads = DB.leads.filter(l=>l.id!==id);
    saveData(DB);
    render();
    toast('🎉 Lead completed! Moved to Clients.');
    return;
  }

  addLog(id, 'stage', `Stage changed: ${oldSi.label} → ${si.label}`);
  lead.stage = newStageId;
  lead.updated = Date.now();
  saveData(DB);
  render();
  toast(`${si.icon} Moved to ${si.label}`);
}

function exportData() {
  const rows = [
    ['Type','First','Last','Phone','Email','Address','Service','Value','Source','Stage/Status','Notes','Date'],
    ...DB.leads.map(l=>[
      'Lead',l.first,l.last,l.phone,l.email||'',l.address||'',l.service,l.value,l.source,
      stageInfo(l.stage).label,l.notes||'',new Date(l.created).toLocaleDateString()
    ]),
    ...DB.clients.map(c=>[
      'Client',c.first,c.last,c.phone,c.email||'',c.address||'',c.service,c.value,c.source,
      'Completed',c.notes||'',new Date(c.completedDate).toLocaleDateString()
    ])
  ];
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'airpro-leads-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('⬇ Export downloaded!');
}

// ── Send SMS sheet ──
function openSMS(phone, firstName, service, stage, type) {
  const key = (stage === 'completed' || type === 'client') ? 'client' : stage;
  const templates = SMS_TEMPLATES[key] || SMS_TEMPLATES['client'];
  const cleanPhone = phone.replace(/\D/g,'');

  const templateCards = templates.map((t, i) => {
    const msg = fillTemplate(t.body, firstName, service);
    const safePhone = cleanPhone.replace(/'/g,"\\'");
    const safeName = firstName.replace(/'/g,"\\'");
    const safeService = service.replace(/'/g,"\\'");
    return `
      <div class="sms-template-card" onclick="selectSMSTemplate(${i},'${safePhone}','${safeName}','${safeService}','${key}')">
        <div class="sms-template-label">${t.label}</div>
        <div class="sms-template-preview">${msg.substring(0,110)}${msg.length>110?'…':''}</div>
      </div>
    `;
  }).join('');

  document.getElementById('smsSheet').innerHTML = `
    <div class="sheet-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div class="sheet-title" style="margin-bottom:0">💬 Send SMS</div>
      <div style="font-family:'Syne',sans-serif;font-weight:600;font-size:13px;color:var(--text-dim)">${firstName}</div>
    </div>
    <div style="font-size:12px;color:var(--text-dim);margin-bottom:20px">📱 ${phone}</div>
    <div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);margin-bottom:10px">
      Choose a Template
      <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-light);font-family:'Literata',serif;font-style:italic"> — {name} and {service} auto-fill</span>
    </div>
    ${templateCards}
    <div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);margin:18px 0 8px">Or Write Custom Message</div>
    <textarea class="fi sms-edit-area" id="smsCustomText" placeholder="Type your message here…"></textarea>
    <button class="sms-send-btn" onclick="sendCustomSMS('${cleanPhone}')">Open in Messages App →</button>
    <button class="btn btn-ghost" onclick="closeOverlay('smsOverlay')" style="margin-top:6px">Cancel</button>
  `;
  openOverlay('smsOverlay');
}

function selectSMSTemplate(idx, cleanPhone, firstName, service, stage) {
  const templates = SMS_TEMPLATES[stage] || SMS_TEMPLATES['client'];
  const msg = fillTemplate(templates[idx].body, firstName, service);
  const encoded = encodeURIComponent(msg);
  window.location.href = `sms:+1${cleanPhone}?body=${encoded}`;
  // Log against the open lead if we can find it
  const lead = DB.leads.find(l => l.phone.replace(/\D/g,'') === cleanPhone);
  if (lead) addLog(lead.id, 'sms', `SMS sent: "${templates[idx].label}"`);
  closeOverlay('smsOverlay');
  toast('💬 Opening Messages app…');
}

function sendCustomSMS(cleanPhone) {
  const msg = document.getElementById('smsCustomText')?.value?.trim();
  if (!msg) { toast('⚠️ Please enter a message'); return; }
  const encoded = encodeURIComponent(msg);
  window.location.href = `sms:+1${cleanPhone}?body=${encoded}`;
  const lead = DB.leads.find(l => l.phone.replace(/\D/g,'') === cleanPhone);
  if (lead) addLog(lead.id, 'sms', `Custom SMS sent: "${msg.substring(0,60)}${msg.length>60?'…':''}"`);
  closeOverlay('smsOverlay');
  toast('💬 Opening Messages app…');
}

  if (leadId !== null) addLog(leadId, 'email', `Custom email sent: "${(subject || 'no subject').substring(0, 50)}"`);

let currentTemplateType = 'sms';
function showTemplateType(type) {
  currentTemplateType = type;
  document.getElementById('tmpl-sms-section').style.display   = type === 'sms'   ? 'block' : 'none';
  document.getElementById('tmpl-email-section').style.display = type === 'email' ? 'block' : 'none';
  ['sms','email'].forEach(t => {
    const btn = document.getElementById('tt-'+t);
    if (!btn) return;
    if (t === type) { btn.style.background=t==='sms'?'var(--orange)':'#6b3fa0'; btn.style.borderColor=t==='sms'?'var(--orange)':'#6b3fa0'; btn.style.color='#fff'; }
    else            { btn.style.background='var(--surface)'; btn.style.borderColor='var(--border)'; btn.style.color='var(--text-dim)'; }
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function addTemplate(type, key) {
  const store = type === 'email' ? EMAIL_TEMPLATES : SMS_TEMPLATES;
  if (!store[key]) store[key] = [];
  if (type === 'email') store[key].push({ label:'✏️ New Email', subject:'Following up', body:'Hi {name},\n\n' });
  else                  store[key].push({ label:'✏️ New Template', body:'Hi {name}! ' });
  renderTemplatesPage();
  showTemplateType(type);
  toast('➕ Template added — tap Save to keep it!');
}

function deleteTemplate(type, key, idx) {
  if (!confirm('Delete this template?')) return;
  const store = type === 'email' ? EMAIL_TEMPLATES : SMS_TEMPLATES;
  store[key].splice(idx, 1);
  renderTemplatesPage();
  showTemplateType(type);
  toast('🗑 Template removed — tap Save to confirm.');
}

function saveTemplatesFromPage() {
  const stageKeys = ['warm','contact','estimate','scheduled','client'];
  // Save SMS
  stageKeys.forEach(key => {
    (SMS_TEMPLATES[key]||[]).forEach((t, i) => {
      const nameEl = document.getElementById(`tname-sms-${key}-${i}`);
      const bodyEl = document.getElementById(`tbody-sms-${key}-${i}`);
      if (nameEl) t.label = nameEl.value.trim() || t.label;
      if (bodyEl) t.body  = bodyEl.value.trim() || t.body;
    });
  });
  saveSMSTemplates(SMS_TEMPLATES);
  // Save Email
  stageKeys.forEach(key => {
    (EMAIL_TEMPLATES[key]||[]).forEach((t, i) => {
      const nameEl = document.getElementById(`tname-email-${key}-${i}`);
      const subjEl = document.getElementById(`tsubj-email-${key}-${i}`);
      const bodyEl = document.getElementById(`tbody-email-${key}-${i}`);
      if (nameEl) t.label   = nameEl.value.trim() || t.label;
      if (subjEl) t.subject = subjEl.value.trim() || t.subject;
      if (bodyEl) t.body    = bodyEl.value.trim() || t.body;
    });
  });
  saveEmailTemplates(EMAIL_TEMPLATES);
  toast('✅ All templates saved!');
}

function resetTemplatesToDefault() {
  if (!confirm('Reset all templates to default? Your edits will be lost.')) return;
  SMS_TEMPLATES   = JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
  EMAIL_TEMPLATES = JSON.parse(JSON.stringify(DEFAULT_EMAIL_TEMPLATES));
  saveSMSTemplates(SMS_TEMPLATES);
  saveEmailTemplates(EMAIL_TEMPLATES);
  renderTemplatesPage();
  toast('🔄 Templates reset to default.');
}

// On load: check URL params for inbound lead from form
function ingestInboundLeads() {
  // Method 1: URL params (standalone form redirect)
  const params = new URLSearchParams(window.location.search);
  if (params.get('airpro_lead') === '1') {
    const lead = {
      id: DB.nextId++,
      first:   params.get('first') || '',
      last:    params.get('last')  || '',
      phone:   params.get('phone') || '',
      email:   params.get('email') || '',
      address: params.get('address') || '',
      service: params.get('service') || 'Other',
      value:   0,
      source:  params.get('source') || 'Website',
      stage:   'warm',
      notes:   params.get('notes') || '',
      log: [{ type:'created', text:`Website lead submitted — ${params.get('service')||'service unknown'}`, ts: Date.now() }],
      created: Date.now(),
      updated: Date.now()
    };
    if (lead.first && lead.phone) {
      DB.leads.push(lead);
      saveData(DB);
      window.history.replaceState({}, '', window.location.pathname);
      setTimeout(() => {
        toast(`🌐 New website lead: ${lead.first} ${lead.last}!`);
        fireLeadNotification(lead);
      }, 600);
    }
  }

  // Method 2: localStorage bridge (same-origin iframe embed)
  try {
    const pending = localStorage.getItem('airpro_pending_leads');
    if (pending) {
      const leads = JSON.parse(pending);
      leads.forEach(l => {
        DB.leads.push({ ...l, id: DB.nextId++, stage:'warm', value:0, source:'Website', created:Date.now(), updated:Date.now() });
      });
      if (leads.length) {
        saveData(DB);
        localStorage.removeItem('airpro_pending_leads');
        setTimeout(() => toast(`🌐 ${leads.length} new website lead${leads.length>1?'s':''} imported!`), 600);
      }
    }
  } catch(e){}
}

let currentWidgetStyle = 'script';
function showWidgetCode(style) {
  currentWidgetStyle = style;
  const code = buildEmbedCode(style);
  document.getElementById('widgetCodeBlock').textContent = code;
  // toggle button styles
  const active = 'border:1.5px solid var(--orange);background:var(--orange);color:#fff';
  const inactive = 'border:1.5px solid var(--border);background:var(--surface);color:var(--text-dim)';
  document.getElementById('wb-script').style.cssText += style==='script' ? active : inactive;
  document.getElementById('wb-iframe').style.cssText += style==='iframe' ? active : inactive;
}

function copyWidgetCode() {
  const code = buildEmbedCode(currentWidgetStyle);
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('widgetCopyBtn');
    if (btn) { btn.textContent = '✅ Copied!'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent='📋 Copy Code'; btn.classList.remove('copied'); }, 2000); }
    toast('📋 Embed code copied!');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = code; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('📋 Embed code copied!');
  });
}
function openOverlay(id) { document.getElementById(id).classList.add('open'); }
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
function handleOvClick(e,id) { if(e.target===document.getElementById(id)) closeOverlay(id); }

//  TOAST
// ══════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

// Register inline service worker for notification support
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;

  // First, unregister any stale service workers and clear old caches
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
  if ('caches' in window) {
    caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  }

  const swCode = `
const CACHE_VERSION = 'a1crm-v${Date.now()}';
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))));
});
self.addEventListener('activate', e => {
  e.waitUntil(self.clients.claim());
});
self.addEventListener('fetch', e => {
  // Never cache — always fetch fresh
  e.respondWith(fetch(e.request, { cache: 'no-store' }).catch(() => caches.match(e.request)));
});
self.addEventListener('message', e => {
  if (e.data && e.data.type === 'SHOW_NOTIFICATION') {
    const { title, body, tag } = e.data;
    self.registration.showNotification(title, {
      body,
      tag: tag || 'airpro-lead',
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23d4521a"/><text y="44" x="12" font-size="36">🌡️</text></svg>',
      badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23d4521a"/></svg>',
      vibrate: [200, 100, 200],
      requireInteraction: true
    });
  }
});
self.addEventListener('notificationclick', e => {
  e.notification.close();
  e.waitUntil(clients.matchAll({ type: 'window' }).then(list => {
    if (list.length) return list[0].focus();
    return clients.openWindow('/');
  }));
});
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swURL = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swURL).catch(() => {});
}

async function requestNotificationPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

async function fireLeadNotification(lead) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;

  const urgent = lead.notes && lead.notes.includes('URGENT');
  const title  = urgent ? `🚨 URGENT Lead — ${lead.first} ${lead.last}` : `🌡️ New Lead — ${lead.first} ${lead.last}`;
  const body   = `${lead.service}${lead.notes ? ' · ' + lead.notes.substring(0, 60) : ''}`;

  // Try via service worker (works when app is backgrounded)
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type:'SHOW_NOTIFICATION', title, body, tag: 'lead-'+lead.id });
    return;
  }
  // Fallback: direct Notification API (only works when app is open/focused)
  try {
    new Notification(title, {
      body,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23d4521a"/><text y="44" x="12" font-size="36">🌡️</text></svg>',
      tag: 'lead-' + lead.id,
      vibrate: [200, 100, 200]
    });
  } catch(e) {}
}

// Poll localStorage every 8 seconds for new website leads
// (catches leads submitted while app is open in another tab or same device)
let lastLeadCount = 0;
function startLeadPoller() {
  lastLeadCount = DB.leads.length;
  setInterval(() => {
    try {
      const pending = localStorage.getItem('airpro_pending_leads');
      if (!pending) return;
      const leads = JSON.parse(pending);
      if (!leads.length) return;
      leads.forEach(l => {
        const newLead = {
          ...l,
          id: DB.nextId++,
          stage: 'warm', value: 0,
          source: l.source || 'Website',
          log: [{ type:'created', text:`Website lead submitted — ${l.service||'service unknown'}`, ts: Date.now() }],
          created: Date.now(), updated: Date.now()
        };
        DB.leads.push(newLead);
        fireLeadNotification(newLead);
      });
      saveData(DB);
      localStorage.removeItem('airpro_pending_leads');
      render();
      toast(`🌐 ${leads.length} new website lead${leads.length > 1 ? 's' : ''} received!`);
    } catch(e) {}
  }, 8000);
}

// Show a soft in-app banner prompting notification permission
function showNotifPrompt() {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'default') return;
  if (localStorage.getItem('airpro_notif_dismissed')) return;

  const banner = document.createElement('div');
  banner.id = 'notif-banner';
  banner.style.cssText = `
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    width:calc(100% - 40px); max-width:390px;
    background:var(--text); color:#fff; border-radius:14px;
    padding:14px 16px; z-index:400; box-shadow:0 4px 24px rgba(0,0,0,0.25);
    display:flex; align-items:center; gap:12px;
    animation: slideUp 0.3s ease;
  `;
  banner.innerHTML = `
    <div style="font-size:28px;flex-shrink:0">🔔</div>
    <div style="flex:1">
      <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin-bottom:2px">Get notified of new leads</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.6);line-height:1.4">We'll alert you the moment a new website lead comes in.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
      <button onclick="enableNotifications()" style="background:var(--orange);color:#fff;border:none;border-radius:8px;padding:7px 12px;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">Enable</button>
      <button onclick="dismissNotifPrompt()" style="background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);border:none;border-radius:8px;padding:5px 12px;font-family:'Syne',sans-serif;font-weight:600;font-size:11px;cursor:pointer">Not now</button>
    </div>
  `;
  document.body.appendChild(banner);
}

function enableNotifications() {
  const banner = document.getElementById('notif-banner');
  if (banner) banner.remove();
  requestNotificationPermission().then(granted => {
    if (granted) {
      toast('🔔 Notifications enabled! You\'ll be alerted of new leads.');
      registerServiceWorker();
    } else {
      toast('⚠️ Notifications blocked — enable them in browser settings.');
    }
  });
}

function dismissNotifPrompt() {
  const banner = document.getElementById('notif-banner');
  if (banner) banner.remove();
  localStorage.setItem('airpro_notif_dismissed', '1');
}

ingestInboundLeads();
render();

// Start notification system after a short delay so UI renders first
setTimeout(() => {
  if (Notification.permission === 'granted') registerServiceWorker();
  else showNotifPrompt();
  startLeadPoller();
}, 1500);
